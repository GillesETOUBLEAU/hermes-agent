# Hermes Agent — Railway Configuration
# Pre-configured for the Discord gateway (orchestrateur unique) with models
# served via OpenRouter. Environment variables (OPENROUTER_API_KEY,
# DISCORD_BOT_TOKEN, etc.) are injected by Railway and loaded from the
# container's .env file.
#
# WhatsApp a été RETIRÉ définitivement (2026-07-26) : le client non officiel
# (Baileys) viole les CGU de Meta, et le nouveau flux d'appairage par passkey
# (juin 2026) bloque structurellement la reconnexion. Discord est le canal
# unique d'orchestration. Historique complet : git log sur ce fichier.

model:
  # Orchestrateur (profil défaut) : Kimi K3 via OpenRouter (choix Gilles
  # 2026-08-04). Historique : qwen/GLM exécutaient au lieu de router →
  # Haiku 4.5 → Opus 4.8 (OpenRouter) → Opus 5 (direct, 2026-07-26) → Kimi K3.
  # ⚠️ La discipline route-only (SOUL.md) avait déjà cassé sur des modèles
  # non-Claude — surveiller que kimi-k3 triage/route sans exécuter.
  default: "moonshotai/kimi-k3"
  provider: "openrouter"

# Bascule automatique mi-session si OpenRouter/kimi sature : Opus 5 en direct
# sur l'API Anthropic (ANTHROPIC_API_KEY, var Railway), conversation préservée.
fallback_providers:
  - provider: anthropic
    model: "claude-opus-5"

gateway:
  platforms:
    discord: {}

terminal:
  backend: local

compression:
  enabled: true

# Tâches auxiliaires (approval, compression, titres…) épinglées sur OpenRouter :
# le fallback "auto" tentait Nous et loggait "Auxiliary Nous client unavailable"
# à chaque run cron/worker (aucun auth Nous configuré sur Railway).
auxiliary:
  approval:
    provider: "openrouter"
    model: "google/gemini-2.5-flash"

# Voix Discord — ElevenLabs des deux côtés, une seule clé (ELEVENLABS_API_KEY,
# var Railway). TTS : bulles vocales (/voice on|tts) + voice channels
# (/voice join). STT : Scribe transcrit ce qui est dit dans le voice channel.
# Sans le bloc stt, l'auto-sélection préférerait groq/openai si leurs clés
# existent (tools/transcription_tools.py) — on pin donc explicitement.
# eleven_multilingual_v2 gère le français ; voice_id = Adam (défaut), à
# remplacer par une voix FR de la bibliothèque ElevenLabs si besoin.
tts:
  provider: "elevenlabs"
  elevenlabs:
    voice_id: "gP52hjM48hyNoVCbizxO"   # voix perso Gilles (bibliothèque ElevenLabs)
    model_id: "eleven_multilingual_v2"

stt:
  provider: "elevenlabs"               # Scribe — même clé que le TTS

# Kanban multi-agent coordination. This (default) profile runs the foreground
# gateway on Railway, so it hosts the dispatcher that claims tasks and spawns
# workers (`hermes -p <assignee> chat -q "work kanban task <id>"`) into the
# web-design / web-dev profiles. The board is shared at <root>/kanban.db across
# all profiles (see hermes_cli/kanban_db.py: kanban_home).
kanban:
  dispatch_in_gateway: true
  # Notifications Kanban — Discord uniquement (WhatsApp retiré 2026-07-26).
  # Lu par le monkeypatch kanban_always_notify_patch.py (usercustomize.py,
  # sur le volume) qui appelle _kb.add_notify_sub sur chaque kanban_create.
  always_notify:
    - platform: "discord"
      chat_id: "1467614563489812673"   # DM Discord Gilles (ID numérique obligatoire)

# Enables the Kanban orchestrator tool surface (kanban_create/list/unblock) so
# this profile can create and assign cross-profile tasks. Le gate lit cette liste
# top-level (tools/kanban_tools.py: _profile_has_kanban_toolset).
toolsets:
  - kanban

# Outils PAR PLATEFORME. Le profil défaut est l'ORCHESTRATEUR (persona SOUL.md :
# triage → kanban_create, jamais d'exécution). Discord garde son preset complet
# (voice, chat) ; la discipline route-only est portée par la persona + le modèle
# Opus, pas par une restriction d'outils.
platform_toolsets:
  cli: [hermes-cli]
  discord: [hermes-discord]

# ─────────────────────────────────────────────────────────────────────────────
# DeepL — serveur MCP hébergé (Streamable HTTP), traduction / reformulation /
# correction / traduction de documents. Aucune clé : OAuth 2.1 avec
# enregistrement de client dynamique + PKCE S256 et scope `offline_access`
# (refresh token → l'accès se renouvelle seul).
#
# Les jetons vivent dans $HERMES_HOME/mcp-tokens/, PARTAGÉ entre tous les
# profils par un lien symbolique de RÉPERTOIRE posé par l'entrypoint : une
# seule autorisation couvre les 5 profils. Ce répertoire n'est jamais réécrit
# par l'entrypoint, donc l'auth survit aux redeploys (contrairement à ce
# fichier, recopié depuis le repo à chaque boot Railway).
#
# Autorisation initiale — une seule fois, navigateur requis :
#   railway ssh
#   su hermes -s /bin/sh -c '/opt/hermes/.venv/bin/hermes mcp login deepl'
# puis coller l'URL de redirection `localhost:PORT/callback?code=…` au prompt
# (le conteneur est headless : le fallback « paste » remplace le callback HTTP).
# Trois pièges, tous rencontrés le 2026-08-13 :
#   1. lancer en tant que `hermes`, JAMAIS root — `railway ssh` ouvre une
#      session root et un mcp-tokens/ root:root en 0700 verrouille la gateway ;
#   2. un seul login à la fois — le client enregistré épingle le port de
#      redirection, deux runs concurrents se disputent le port ; ne PAS fixer un
#      autre `oauth.redirect_port`, DeepL rejetterait le redirect_uri divergent ;
#   3. ne coller que si le prompt de paste est affiché — dans bash, les `&` de
#      l'URL la découpent en jobs d'arrière-plan.
#
# NB : ce siège DeepL n'expose que 8 des 16 outils documentés (pas de
# glossaires ni de style rules — affaire de palier d'abonnement). Pour les
# glossaires et le quota, la skill `deepl-translation` couvre l'API REST v2.
# ─────────────────────────────────────────────────────────────────────────────
mcp_servers:
  deepl:
    url: "https://mcp.deepl.com/v1/mcp"
    auth: oauth
    enabled: true

# Skills désactivées (2026-08-05) : bundles Nous hors-scope (ML/fine-tuning,
