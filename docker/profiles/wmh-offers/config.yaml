# Profil WMH Offers — Propositions Digitales
# Persona : SOUL.md (pipeline digital offers, devis, PPTX, council).
# Skills préchargées via external_dirs : wmh-digital-offers, wmh-pptx-presentations,
#   devis-digital, llm-council (dans /opt/data/skills/wmh/).
# Amorcé sur le volume par docker/entrypoint.sh.

model:
  default: "anthropic/claude-fable-5"
  provider: "openrouter"

terminal:
  backend: local

toolsets:
  - kanban

auxiliary:
  approval:
    provider: "openrouter"
    model: "google/gemini-2.5-flash"

# DeepL — serveur MCP hébergé, auth OAuth 2.1 (aucune clé). Les jetons sont
# partagés entre tous les profils via le lien mcp-tokens/ posé par
# l'entrypoint : une seule autorisation suffit. Procédure de login initial et
# pièges : voir docker/railway-config.yaml.
mcp_servers:
  deepl:
    url: "https://mcp.deepl.com/v1/mcp"
    auth: oauth
    enabled: true

skills:
  external_dirs:
    - /opt/data/skills
  # Skills désactivées (2026-08-05) — liste partagée par les 5 profils,
  # rafraîchie depuis ce template à chaque boot Railway (source de vérité).
